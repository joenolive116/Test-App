<!DOCTYPE html>
<html>
<head>
    <title>Newton ROI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Newton ROI Calculator</h1>
        <p>Estimate how much revenue a dental office may be losing from missed calls.</p>
    
        <label>Monthly Calls:</label><br>
        <input id="calls" type="number" placeholder="Example: 1000"><br><br>
    
        <label>Missed Call Percentage:</label><br>
        <input id="missed" type="number" placeholder="Example: 20"><br><br>
    
        <label>Average New Patient Value:</label><br>
        <input id="value" type="number" placeholder="Example: 500"><br><br>
    
        <button onclick="calculateROI()">Calculate</button>
    
        <div id="result"></div>
    </div>
    <script>
        function calculateROI() {

            let calls = Number(document.getElementById("calls").value);
            let missed = Number(document.getElementById("missed").value);
            let value = Number(document.getElementById("value").value);
        
            let missedCalls = calls * (missed / 100);
        
            let lostPatients = missedCalls * 0.30;
        
            let lostRevenue = lostPatients * value;
        
            let recoveredRevenue = lostRevenue * 0.70;
        
            document.getElementById("result").innerHTML =
                `
                <strong>Missed Calls:</strong> ${Math.round(missedCalls)}<br>
                <strong>Potential Patients Lost:</strong> ${Math.round(lostPatients)}<br>
                <strong>Estimated Revenue Lost:</strong> $${lostRevenue.toLocaleString()}<br><br>
        
                <strong>Revenue Potential Recovered with Newton:</strong><br>
                $${recoveredRevenue.toLocaleString()}
                `;
        }
   
    </script>

</body>
</html>
